name: Free HTTPS transport preflight
on:
  push:
    branches: ['qa/free-https-preflight']
    paths: ['.github/workflows/pso-free-https-preflight.yml']
permissions: {}
jobs:
  probe:
    if: ${{ github.repository == 'EvgK724/pso-code-viewer' && github.event.repository.visibility == 'public' && github.event.deleted == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check native HTTPS with synthetic data only
        shell: bash
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          cat > runner_preflight.py <<'PYTHON'
          """One free, accountless HTTPS transport probe. Origin serves two fixed synthetic responses only."""
          from hashlib import sha256
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from threading import Thread, Event
          import json, os, re, shutil, subprocess, sys, time, urllib.request, uuid
          import socket, ssl, urllib.error

          TAG='2026.11.1'
          SHA='97bb3b02d23a5980fc9c15a1a270e692da1923f103f920d5b16d4931d5ab55e7'
          SIZE=40346301
          PUBLIC_ASSET=f'https://github.com/cloudflare/cloudflared/releases/download/{TAG}/cloudflared-linux-amd64'
          OUT=Path(__file__).resolve().parent/'runner-result.json'
          marker=('synthetic-'+uuid.uuid4().hex).encode('ascii')

          browser_ok=Event()
          challenge=uuid.uuid4().hex
          HTML=b'<!doctype html><meta charset="utf-8"><title>Synthetic transport probe</title><script type="module" src="/check.mjs"></script>'
          JS=b"""if (!isSecureContext || location.protocol !== 'https:') throw Error('HTTPS required');
          await navigator.serviceWorker.register('/probe-sw.js');
          await navigator.serviceWorker.ready;
          if (!navigator.serviceWorker.controller)
            await new Promise(ok => navigator.serviceWorker.addEventListener('controllerchange',ok,{once:true}));
          if (await (await fetch('/worker-proof')).text() !== 'worker-controlled') throw Error('Worker missing');
          const proof=await fetch('/probe',{method:'POST',body:'test'});
          if ((await proof.text()) !== __MARKER__) throw Error('POST failed');
          await fetch('/browser-ok',{method:'POST',body:location.hash.slice(1)});
          """.replace(b'__MARKER__',json.dumps(marker.decode()).encode())
          SW=b"""self.addEventListener('install',e=>e.waitUntil(self.skipWaiting()));
          self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch',e=>{if(new URL(e.request.url).pathname==='/worker-proof')
          e.respondWith(new Response('worker-controlled'));});"""
          PUBLIC={'/probe':('text/plain',marker),'/':('text/html',HTML),'/check.mjs':('text/javascript',JS),'/probe-sw.js':('text/javascript',SW)}

          class Origin(BaseHTTPRequestHandler):
              def log_message(self,*args): pass
              def respond(self, status, data, mime='text/plain'):
                  self.send_response(status)
                  self.send_header('Content-Type',mime+'; charset=utf-8')
                  self.send_header('Content-Security-Policy',"default-src 'none'; script-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'")
                  self.send_header('Content-Length',str(len(data)))
                  self.send_header('Cache-Control','no-store')
                  self.end_headers()
                  self.wfile.write(data)
              def do_GET(self):
                  if self.path not in PUBLIC:return self.respond(404,b'')
                  mime,data=PUBLIC[self.path];self.respond(200,data,mime)
              def do_POST(self):
                  if self.path=='/browser-ok' and self.headers.get('Content-Length')==str(len(challenge)):
                      self.connection.settimeout(2)
                      if self.rfile.read(len(challenge))==challenge.encode():
                          browser_ok.set();return self.respond(200,b'ok')
                      return self.respond(403,b'')
                  if self.path!='/probe' or self.headers.get('Content-Length')!='4': return self.respond(404,b'')
                  self.connection.settimeout(2)
                  self.respond(200,marker) if self.rfile.read(4)==b'test' else self.respond(400,b'')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): return None

          def probe(opener,url,data=None):
              with opener.open(urllib.request.Request(url,data=data),timeout=8) as r:
                  if r.status!=200 or r.read(256)!=marker: raise ValueError('Unexpected probe response')

          def public_failure(error):
              """Return only allowlisted categories and numeric codes; never include exception text."""
              if isinstance(error, urllib.error.HTTPError):
                  return {'category':'http', 'status':error.code}
              cause = error.reason if isinstance(error, urllib.error.URLError) else error
              if isinstance(cause, OSError):
                  status = re.fullmatch(r'Tunnel connection failed: ([1-5][0-9]{2})(?: [^\r\n]*)?', str(cause))
                  if status:
                      return {'category':'proxy_connect_http', 'status':int(status.group(1))}
              if isinstance(cause, ssl.SSLCertVerificationError):
                  category = 'certificate_verification'
              elif isinstance(cause, ssl.SSLError):
                  category = 'tls'
              elif isinstance(cause, socket.gaierror):
                  category = 'dns'
              elif isinstance(cause, TimeoutError):
                  category = 'timeout'
              elif isinstance(cause, ConnectionRefusedError):
                  category = 'connection_refused'
              elif isinstance(cause, ConnectionResetError):
                  category = 'connection_reset'
              else:
                  category = 'unclassified'
              result = {'category':category}
              for field in ('errno','verify_code'):
                  value = getattr(cause,field,None)
                  if type(value) is int:
                      result[field] = value
              return result

          def public_get(client, url, report, *, request=probe, pause=time.sleep, clock=time.monotonic):
              # Retry only name resolution of this newly assigned hostname, through the same resolver.
              delays = (0, 2, 5, 10, 15)
              evidence = report['publicGetAttempts'] = []
              start = clock()
              for index, delay in enumerate(delays):
                  if delay:
                      pause(delay)
                  try:
                      request(client, url)
                  except OSError as error:
                      failure = public_failure(error)
                      evidence.append({'elapsedMs':round((clock()-start)*1000), **failure})
                      dns_pending = failure.get('category') == 'dns' and failure.get('errno') in (socket.EAI_NONAME, socket.EAI_AGAIN)
                      if not dns_pending or index == len(delays)-1:
                          raise
                  else:
                      evidence.append({'elapsedMs':round((clock()-start)*1000), 'result':'PASS'})
                      return

          def main():
              report={'product':'Cloudflare anonymous Quick Tunnel','stage':'official binary','result':'NOT RUN','productionAccess':False,'sentApplicationOrPersonalData':False,'trustChanges':False,'codespaceCreated':False}
              chrome=shutil.which('google-chrome') or shutil.which('chromium')
              if not chrome:raise SystemExit('Standard Linux runner with ordinary sandboxed Chrome required')
              try:
                  with TemporaryDirectory(prefix='pso-free-transport-') as temp:
                      d=Path(temp)
                      binary=d/'cloudflared'
                      with urllib.request.urlopen(PUBLIC_ASSET,timeout=20) as r: b=r.read(SIZE+1)
                      if len(b)!=SIZE or sha256(b).hexdigest()!=SHA: raise ValueError('Official binary size or checksum mismatch')
                      binary.write_bytes(b);binary.chmod(0o700);del b
                      report['verifiedBinary']={'tag':TAG,'sha256':SHA}
                      with HTTPServer(('127.0.0.1',0),Origin) as server:
                          server.timeout=.5
                          thread=Thread(target=server.serve_forever,daemon=True);thread.start()
                          try:
                              local='http://127.0.0.1:'+str(server.server_port)
                              probe(urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect),local+'/probe')
                              report['loopbackOrigin']='PASS';report['stage']='accountless temporary tunnel'
                              cfg=d/'empty.yml';cfg.write_text('{}\n')
                              # Never supply a Cloudflare account, pre-existing named tunnel or a workstation service.
                              env={k:v for k,v in os.environ.items() if k in ('PATH','LANG','HTTPS_PROXY','HTTP_PROXY','ALL_PROXY','NO_PROXY','https_proxy','http_proxy','all_proxy','no_proxy')}
                              with (d/'diagnostic').open('wb') as log:
                                  p=subprocess.Popen([str(binary),'tunnel','--config',str(cfg),'--no-autoupdate','--metrics','127.0.0.1:0','--retries','0','--url',local],cwd=d,env=env,stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT)
                                  try:
                                      start=time.monotonic();host=None;registered=False;logs=''
                                      while time.monotonic()-start<28:
                                          logs=(d/'diagnostic').read_text(errors='replace')[-16000:]
                                          m=re.search(r'https://([a-z0-9-]+\.trycloudflare\.com)(?=[\s|/]|$)',logs)
                                          if m and m.group(1)!='api.trycloudflare.com': host=m.group(1)
                                          registered='Registered tunnel connection' in logs
                                          if host and registered:break
                                          if p.poll() is not None:break
                                          time.sleep(.3)
                                      report['usableUrlConfirmed']=bool(host and registered);report['registered']=registered
                                      if not host or not registered:
                                          signatures=['403 Forbidden','429 Too Many Requests','502 Bad Gateway','failed to request quick Tunnel','failed to request quick tunnel','no route to host','network is unreachable','i/o timeout','context deadline exceeded','connection refused','lookup','permission denied','failed to parse','failed to resolve','not writable','no such file or directory','EOF']
                                          report['diagnostics']=[s for s in signatures if s.lower() in logs.lower()]
                                          report['clientExit']=p.poll()
                                          raise RuntimeError('Tunnel registration not confirmed within the bounded preflight')
                                      report['stage']='public HTTPS GET, default certificate and hostname verification'
                                      remote='https://'+host+'/probe'
                                      client=urllib.request.build_opener(NoRedirect)
                                      public_get(client,remote,report);report['publicGet']='PASS'
                                      report['stage']='public HTTPS POST, default certificate and hostname verification'
                                      probe(client,remote,b'test');report['publicPost']='PASS'
                                      report['stage']='native HTTPS, Service Worker control and same-origin POST'
                                      url='https://'+host+'/#'+challenge
                                      flags=['--headless','--no-first-run','--no-default-browser-check','--disable-background-networking','--disable-sync','--disable-extensions','--user-data-dir='+str(d/'profile')]
                                      browser=subprocess.Popen([chrome,*flags,url],stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                                      try:
                                          if not browser_ok.wait(25):raise RuntimeError('Native browser did not confirm secure context, SW and same-origin POST')
                                          report['nativeSyntheticBrowser']='PASS';report['result']='PASS'
                                      finally:
                                          if browser.poll() is None:
                                              browser.terminate()
                                              try:browser.wait(timeout=4)
                                              except subprocess.TimeoutExpired:browser.kill();browser.wait()
                                  finally:
                                      if p.poll() is None:
                                          p.terminate()
                                          try:p.wait(timeout=4)
                                          except subprocess.TimeoutExpired:p.kill();p.wait()
                          finally:server.shutdown();thread.join()
              except Exception as e:
                  report['result']='BLOCKED'
                  # Do not persist any proxy URLs, temporary public hostnames, IPs or tunnel IDs.
                  if isinstance(e,(urllib.error.URLError,OSError)):report['transportFailure']=public_failure(e)
                  elif isinstance(e,(RuntimeError,ValueError)):report['error']=str(e)
                  else:report['errorType']=type(e).__name__;report['errno']=getattr(e,'errno',None)
              report['localCleanup']=not Path(temp).exists() if 'temp' in locals() else True
              OUT.write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report))
              return int(report['result']!='PASS')
          if __name__=='__main__':sys.exit(main())
          PYTHON
          python3 runner_preflight.py
